# Added to the commit count for the versionCode (KTD11). Raised past the local builds with padded counts that sat on
# the stick in Nov 2026; raise it again if the stick ever holds a build CI can no longer pass. CI reads it too.
iptv.versionOffset=30
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
android.onlyEnableUnitTestForTheTestedBuildType=false
# Quit the Gradle and Kotlin daemons after 10 idle minutes (they hold ~5 GB between builds)
org.gradle.daemon.idletimeout=600000
kotlin.daemon.options=autoshutdownIdleSeconds=600
